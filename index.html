<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataPilot AI — By Mohamed El-Khatib | Smart Data Analytics</title>
<meta name="description" content="Privacy-first, automated data analytics workspace by Mohamed El-Khatib: ingestion, profiling, quality, cleaning, SQL, EDA, KPIs, dashboards & reports.">
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#0A192F; --sub:#475569; --line:#e2e8f0;
  --navy:#0A192F; --navy-light:#112240; --sky:#0284C7; --sky-bright:#38BDF8; --gold:#F59E0B;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444;
  --grad:linear-gradient(135deg,#0A192F 0%,#0284C7 65%,#38BDF8 130%);
  --grad-gold:linear-gradient(135deg,#D97706 0%,#F59E0B 100%);
  --shadow:0 1px 3px rgba(10,25,47,.06),0 10px 28px -12px rgba(10,25,47,.14);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
#app{display:flex;min-height:100vh}
/* ---------- Sidebar ---------- */
#sidebar{width:246px;flex:0 0 246px;background:linear-gradient(180deg,#060f1e 0%,#0A192F 60%,#112240 100%);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid rgba(56,189,248,.12)}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0284C7,#38BDF8);display:flex;align-items:center;justify-content:center;flex:0 0 38px;box-shadow:0 4px 16px -4px rgba(56,189,248,.5);border:1px solid rgba(255,255,255,.2)}
.brand .logo svg{width:20px;height:20px}
.brand b{color:#fff;font-size:15.5px;letter-spacing:.2px;display:block;line-height:1.2}
.brand small{color:#38BDF8;font-size:10.5px;font-weight:600}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#64748b;padding:12px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;color:#94a3b8;cursor:pointer;font-size:13px;border:1px solid transparent;user-select:none;transition:all .15s}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav-item:hover{background:rgba(56,189,248,.08);color:#f8fafc}
.nav-item.active{background:linear-gradient(90deg,rgba(2,132,199,.32),rgba(56,189,248,.08));color:#fff;border-color:rgba(56,189,248,.4);font-weight:600}
.nav-item.active svg{color:#38BDF8;opacity:1}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.author-box{background:rgba(255,255,255,.04);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:10px 11px;margin-bottom:10px}
.author-box .role{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#F59E0B;font-weight:700}
.author-box .aname{font-size:13px;font-weight:700;color:#fff;margin-top:2px}
.author-box .aname-ar{font-size:12px;color:#38BDF8;font-weight:600}
.priv{display:flex;gap:8px;align-items:flex-start;background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.25);border-radius:10px;padding:8px 10px;font-size:10.5px;color:#6ee7b7;line-height:1.4}
.priv svg{width:13px;height:13px;flex:0 0 13px;margin-top:2px}
/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px}
#topbar .ds{font-size:13.5px;font-weight:700;color:var(--navy)}
#topbar .meta{font-size:12px;color:var(--sub)}
#topbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
#view{padding:22px;max-width:1200px;width:100%;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* ---------- Components ---------- */
h1{font-size:22px;font-weight:750;letter-spacing:-.02em;color:var(--navy)}
h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--navy)}
h3{font-size:13.5px;font-weight:700;color:var(--navy)}
.sub{color:var(--sub);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:980px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h3{margin-bottom:10px}
.stat{position:relative;overflow:hidden;border-top:3px solid var(--sky)}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--sub);font-weight:650}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px;color:var(--navy)}
.stat .spark{position:absolute;right:12px;top:14px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat .spark svg{width:17px;height:17px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);background:#f8fafc;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f0f9ff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:var(--sky);color:var(--sky);transform:translateY(-1px);box-shadow:0 4px 10px -6px rgba(10,25,47,.25)}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 16px -8px rgba(2,132,199,.75)}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.gold{background:var(--grad-gold);border:none;color:#fff;box-shadow:0 6px 16px -8px rgba(245,158,11,.7)}
.btn.danger{color:var(--red);border-color:#fecaca;background:#fff}
.btn.danger:hover{background:#fef2f2;color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
select,input[type=text],input[type=number],textarea{font-family:inherit;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid #cbd5e1;border-radius:9px;padding:8px 10px;outline:none;transition:border .15s, box-shadow .15s;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
textarea{resize:vertical;min-height:80px}
label.f{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);margin:10px 0 5px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row .fwrap{flex:1;min-width:130px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px;text-transform:uppercase}
.b-num{background:#e0f2fe;color:#0369a1}.b-str{background:#f1f5f9;color:#0A192F}.b-date{background:#fef3c7;color:#b45309}.b-bool{background:#d1fae5;color:#047857}.b-empty{background:#f1f5f9;color:#64748b}
.bar{height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.bar.warn>i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.drop{border:2px dashed #94a3b8;border-radius:var(--r);padding:34px 20px;text-align:center;background:#f8fafc;cursor:pointer;transition:all .18s}
.drop:hover,.drop.over{border-color:var(--sky);background:#e0f2fe}
.drop svg{width:34px;height:34px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--gold);background:#fffbeb;color:#b45309}
.kpi-card{position:relative;border-left:4px solid var(--gold)}
.kpi-card .kv{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--navy);margin:6px 0 2px}
.kpi-mini{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.kpi-mini td{padding:3px 4px;border-top:1px solid #f1f5f9}
.kpi-mini td:last-child{text-align:right;font-weight:700;color:var(--sky)}
.x{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;border:none;background:#f1f5f9;color:var(--sub);cursor:pointer;font-size:13px;line-height:1}
.x:hover{background:#fee2e2;color:var(--red)}
.score-wrap{display:flex;align-items:center;gap:22px}
.ring{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 118px;position:relative}
.ring:before{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.ring b{position:relative;font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.issue{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.issue:last-child{border-bottom:none}
.issue .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.issue .ic svg{width:14px;height:14px}
.hm{display:grid;gap:3px;font-size:10px}
.hm .cell{border-radius:5px;padding:6px 4px;text-align:center;color:#fff;font-weight:600;min-width:44px}
.recipe li{list-style:none;display:flex;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px dashed #e2e8f0}
.recipe li:last-child{border:none}
.recipe .n{width:20px;height:20px;border-radius:6px;background:#e0f2fe;color:#0369a1;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 20px}
.empty{border:1.5px dashed #cbd5e1;border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--sub)}
.empty svg{width:36px;height:36px;margin-bottom:10px;opacity:.6}
.hero{background:linear-gradient(135deg,#0A192F 0%,#112240 100%);color:#fff;border-radius:18px;padding:34px 30px;box-shadow:var(--shadow);position:relative;overflow:hidden;border:1px solid rgba(56,189,248,.25)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(56,189,248,.22),transparent 70%);border-radius:50%}
.hero h1{font-size:26px;color:#fff}
.hero .ar{direction:rtl;display:inline-block;color:#F59E0B;font-weight:700;font-size:14.5px;margin-top:4px}
.hero .sub{color:#cbd5e1}
.pipe{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.pipe span{font-size:10.5px;font-weight:650;letter-spacing:.04em;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);color:#38BDF8;padding:4px 9px;border-radius:99px}
.pipe i{color:#64748b;font-style:normal}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:#0A192F;color:#fff;border:1px solid #38BDF8;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:11px;opacity:0;transition:all .3s;z-index:99;box-shadow:0 10px 30px -8px rgba(10,25,47,.6);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#991b1b;border-color:#fca5a5}
canvas.chart{display:block;width:100%}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.insight{border-left:4px solid var(--sky)}
.insight.warn{border-left-color:var(--gold)} .insight.good{border-left-color:var(--green)}
.insight b{font-size:12.5px;color:var(--navy)}.insight p{font-size:12px;color:var(--sub);margin-top:3px}
.fine{font-size:11px;color:var(--sub)}
.divider{height:1px;background:var(--line);margin:14px 0}
.tagb{font-size:10px;background:#e0f2fe;border-radius:6px;padding:2px 7px;color:#0369a1;font-weight:700}
.sql-box{background:#0A192F;color:#38BDF8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;padding:12px;border-radius:10px;border:1px solid #1e293b;min-height:95px}
.sql-box:focus{border-color:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.2)}
@media(max-width:860px){#sidebar{width:64px;flex-basis:64px}.brand b,.brand small,.nav-item span,.nav-label,.author-box,.priv{display:none}.nav-item{justify-content:center;padding:9px}.side-foot{padding:10px}}
</style>

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M17 6h3v3"/></svg></div>
      <div><b>DataPilot AI</b><small>Smart Analytics Studio</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="author-box">
        <div class="role">Engineered By</div>

      </div>
      <div class="priv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/></svg><span><b>100% Local-First.</b> All parsing, SQL &amp; charts run inside your browser. Zero cloud uploads.</span></div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <span class="pill"><span class="dot"></span><span id="saveState">Local session</span></span>
      <span class="ds" id="dsName">No dataset loaded</span>
      <span class="meta" id="dsMeta"></span>
      <span class="sp"></span>
      <button class="btn sm" onclick="downloadCSV()" title="Download the current working table as CSV">Export CSV</button>
      <button class="btn sm gold" onclick="saveToLibrary()" title="Persist current dataset to browser storage">Save dataset</button>
    </header>
    <div id="view"></div>

</div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const fmt=n=>{ if(n==null||isNaN(n))return '—'; if(typeof n!=='number')return String(n); const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(2)+'B'; if(a>=1e6)return (n/1e6).toFixed(2)+'M'; if(a>=1e5)return (n/1e3).toFixed(1)+'K';
  if(Number.isInteger(n))return n.toLocaleString('en-US'); return (+n.toFixed(2)).toLocaleString('en-US'); };
const pct=x=>isNaN(x)?'—':(x*100).toFixed(1)+'%';
function toast(msg,type){ const t=document.createElement('div'); t.className='toast'+(type==='err'?' err':''); t.textContent=msg; document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),320);},2700); }
function parseNum(v){
  if(typeof v==='number') return v;
  if(v==null) return NaN;
  let s=String(v).trim().replace(/[$€£¥,\s]/g,'');
  if(s===''||s==='-'||s==='.') return NaN;
  if(s.endsWith('%')) s=s.slice(0,-1);
  const neg=/^\(.*\)$/.test(s); if(neg) s=s.slice(1,-1);
  const n=Number(s); return isNaN(n)?NaN:(neg?-n:n);
}
/* ---------- State ---------- */
const S={ tab:'home', dataset:null, derived:null, cleanLog:[], kpis:[], charts:[], sqlRes:null, sqlQuery:'SELECT * FROM data LIMIT 15' };
const active=()=>S.derived||S.dataset;
let PERSIST=true;
const Session={
  key:'dp_khatib_v2',
  save(){ if(!PERSIST)return; try{ localStorage.setItem(this.key, JSON.stringify({dataset:S.dataset,derived:S.derived,cleanLog:S.cleanLog,kpis:S.kpis,charts:S.charts})); $('#saveState').textContent='Saved locally'; }catch(e){ PERSIST=false; $('#saveState').textContent='In-memory only'; } },
  load(){ try{ const raw=localStorage.getItem(this.key); if(!raw)return false; const d=JSON.parse(raw); Object.assign(S,{dataset:d.dataset||null,derived:d.derived||null,cleanLog:d.cleanLog||[],kpis:d.kpis||[],charts:d.charts||[]}); return true; }catch(e){ return false; } }
};
const DB={
  _p:null,
  open(){ if(this._p)return this._p; this._p=new Promise((res,rej)=>{ try{ const r=indexedDB.open('datapilot_khatib',1);
    r.onupgradeneeded=e=>{ e.target.result.createObjectStore('datasets',{keyPath:'id'}); };
    r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error); }catch(e){rej(e);} }); return this._p; },
  async put(rec){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('datasets','readwrite'); t.objectStore('datasets').put(rec); t.oncomplete=res; t.onerror=()=>rej(t.error); }); },
  async all(){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const r=db.transaction('datasets').objectStore('datasets').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }catch(e){ return []; } },
  async del(id){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const t=db.transaction('datasets','readwrite'); t.objectStore('datasets').delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }
};
/* ---------- CSV & Excel ---------- */
function detectDelim(text){
  const first=(String(text).slice(0,4000).split(/\r?\n/)[0])||'';
  let best=',', mx=0;
  for(const d of [',',';','\t','|']){ const n=first.split(d).length; if(n>mx){mx=n;best=d;} }
  return best;
}
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,'');
  const delim=detectDelim(text);
  const rows=[]; let row=[], cur='', q=false;
  const pushRow=()=>{ row.push(cur); cur=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; };
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; pushRow(); }
    else cur+=c;
  }
  pushRow();
  if(!rows.length) return {headers:[],rows:[]};
  const seen={};
  const headers=rows.shift().map((h,i)=>{ h=String(h).trim()||('col_'+(i+1)); if(seen[h]!==undefined){seen[h]++; h=h+'_'+(seen[h]+1);} else seen[h]=1; return h; });
  const out=rows.map(r=>{ const o={}; headers.forEach((h,i)=>o[h]=r[i]===undefined?'':r[i]); return o; });
  return {headers,rows:out};
}
function toCSV(headers,rows){
  const q=v=>{ v=String(v??''); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return [headers.map(q).join(','), ...rows.map(r=>headers.map(h=>q(r[h])).join(','))].join('\n');
}
async function maybeParseWorkbook(buf){
  if(typeof XLSX==='undefined') return null;
  try{
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(!aoa.length) return null;

    const cats=[['Electronics','Wireless Mouse','USB-C Hub','Mechanical Keyboard'],['Furniture','Ergonomic Chair','Standing Desk','Monitor Arm'],['Office Supplies','Notebook Set','Whiteboard Markers','Stapler'],['Accessories','Laptop Sleeve','Webcam','Cable Organizer']];
    const headers=['date','region','category','product','units','unit_price','discount'];
    const rows=[];
    for(let d=1;d<=28;d++){ const n=ri(4,9);
      for(let k=0;k<n;k++){ const c=pick(cats), price=+(c[0]==='Electronics'?30+R()*270:c[0]==='Furniture'?80+R()*420:5+R()*90).toFixed(2);
        rows.push({date:'2026-11-'+String(d).padStart(2,'0'),region:pick(regions),category:c[0],product:pick(c.slice(1)),units:ri(1,12),unit_price:price,discount:pick([0,0,0,0.05,0.1,0.15])}); } }
    return {name:'Sample · Retail Sales',headers,rows};
  }
  if(kind==='hr'){
    const depts=['Engineering','Sales','Marketing','HR','Finance','Operations'];
    const headers=['employee_id','department','age','salary','years_at_company','satisfaction','attrition'];
    const rows=[];
    for(let i=1;i<=120;i++){ const age=ri(22,60), yrs=ri(0,Math.min(20,age-21));
      rows.push({employee_id:'E'+String(1000+i),department:pick(depts),age,salary:ri(38,145)*1000,years_at_company:yrs,
        satisfaction:ri(1,5),attrition:(R()<(yrs>8?0.08:0.18))?'Yes':'No'}); }
    return {name:'Sample · HR Attrition',headers,rows};
  }
  const channels=['Organic Search','Paid Ads','Email','Social','Referral','Direct'];
  const headers=['month','channel','spend','impressions','clicks','conversions','revenue'];
  const rows=[];
  for(let m=1;m<=12;m++){ channels.forEach(ch=>{ const imp=ri(8,90)*1000;
    const ctr=0.01+R()*0.05, clicks=Math.round(imp*ctr);
    const convRate=0.02+R()*0.08, conv=Math.round(clicks*convRate);
    rows.push({month:'2026-'+String(m).padStart(2,'0'),channel:ch,spend:ri(500,9000),impressions:imp,clicks,
      conversions:conv,revenue:conv*ri(20,120)}); }); }
  return {name:'Sample · Marketing Campaigns',headers,rows};
}

async function handleFile(f){
  const name=f.name.replace(/\.[^.]+$/,'');
  try{
    if(/\.xlsx?$/i.test(f.name)){
      toast('Reading Excel…');
      const buf=await f.arrayBuffer();
      await ensureSheetJS();
      const parsed=await maybeParseWorkbook(buf);
      if(parsed) return setDataset({name,headers:parsed.headers,rows:parsed.rows,source:f.name},'Excel loaded: '+f.name);
      return toast('Could not parse workbook','err');
    }
    const text=await f.text();
    if(/\.json$/i.test(f.name)){
      const j=JSON.parse(text);
      const arr=Array.isArray(j)?j:(j.data||j.rows||null);
      if(!arr||!arr.length||typeof arr[0]!=='object') return toast('JSON must be an array of objects','err');
      const headers=[...new Set(arr.flatMap(o=>Object.keys(o)))];
      return setDataset({name,headers,rows:arr.map(o=>{const r={};headers.forEach(h=>r[h]=o[h]??'');return r;}),source:f.name});
    }
    const {headers,rows}=parseCSV(text);
    if(!headers.length) return toast('Could not detect any rows','err');
    setDataset({name,headers,rows,source:f.name});
  }catch(e){ toast('Failed to read file: '+e.message,'err'); }
}
function ensureSheetJS(){
  if(typeof XLSX!=='undefined')return Promise.resolve();
  return new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=res; s.onerror=()=>rej(new Error('CDN unreachable')); document.head.appendChild(s); });
}
function loadPasted(){

  if(!headers.length) return toast('Could not parse that data','err');
  setDataset({name:'Pasted data',headers,rows,source:'paste'});
}

function cleanQualityHTML(){ const q=qualityReport(active());
  return `<div class="row" style="align-items:center;gap:16px"><div class="ring" style="width:84px;height:84px;flex-basis:84px;background:conic-gradient(var(--green) ${q.score*3.6}deg,#e2e8f0 0)"><b style="font-size:19px">${q.score}</b></div>
  <div class="fine">missing cells: <b>${q.missing}</b> · duplicates: <b>${q.dupRows}</b> · invalid: <b>${q.invalid}</b></div></div>`; }
function mutate(fn,name,detail){
  const ds=active();
  try{
    const res=fn(ds);
    const target=S.derived||S.dataset;
    target.headers=res.headers||target.headers;
    target.rows=res.rows;
    const finalDetail=typeof detail==='function'?detail(res):detail;
    S.cleanLog.push({name,detail:finalDetail||'',ts:new Date().toLocaleTimeString()});
    Session.save(); updateTopbar(); render();
    toast(name+' applied');
  }catch(e){ toast('Operation failed: '+e.message,'err'); }
}
function logOp(name,detail){ S.cleanLog.push({name,detail,ts:new Date().toLocaleTimeString()}); Session.save(); }
function opDedupe(){ const before=active().rows.length;
  mutate(ds=>{ const seen=new Set(), rows=ds.rows.filter(r=>{ const k=JSON.stringify(ds.headers.map(h=>r[h])); if(seen.has(k))return false; seen.add(k); return true; });
  return {rows}; },'Remove duplicates',res=>fmt(before-res.rows.length)+' removed'); }
function opTrimAll(){ mutate(ds=>({rows:ds.rows.map(r=>{const o={...r};Object.keys(o).forEach(k=>{if(typeof o[k]==='string')o[k]=o[k].trim();});return o;})}),'Trim whitespace','all text columns'); }
function opFill(){
  const col=$('#fillCol').value, how=$('#fillHow').value, fixed=$('#fillVal').value;
  mutate(ds=>{
    let rows=ds.rows;
    const cols=col==='__all__'?ds.headers:[col];
    if(how==='drop'){ rows=rows.filter(r=>!cols.some(c=>r[c]===''||r[c]==null||String(r[c]).trim()==='')); return {rows}; }
    const fills={};
    cols.forEach(c=>{
      const vals=rows.map(r=>r[c]).filter(v=>v!==''&&v!=null&&String(v).trim()!=='');
      if(how==='mean'||how==='median'){ const n=vals.map(parseNum).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
        if(!n.length){fills[c]='';return;} fills[c]=how==='mean'?mean(n):quantile(n,.5); }
      else if(how==='mode'){ const t=topVals(vals,1); fills[c]=t.length?t[0].v:''; }
      else fills[c]=fixed;
    });
    return {rows:rows.map(r=>{const o={...r};cols.forEach(c=>{if(o[c]===''||o[c]==null||String(o[c]).trim()==='')o[c]=fills[c];});return o;})};
  },'Fill missing',col==='__all__'?'all columns · '+how:col+' · '+how+(how==='fixed'?' = '+fixed:''));
}
function opDropCol(){ const c=$('#dropCol').value;
  mutate(ds=>{ const headers=ds.headers.filter(h=>h!==c);
    return {headers,rows:ds.rows.map(r=>{const o={...r};delete o[c];return o;})}; },'Drop column',c); }
function opRename(){ const c=$('#renCol').value, n=$('#renNew').value.trim();
  if(!n) return toast('Enter a new name','err');
  if(active().headers.includes(n)&&n!==c) return toast('That name already exists','err');
  mutate(ds=>{ const headers=ds.headers.map(h=>h===c?n:h);
    return {headers,rows:ds.rows.map(r=>{const o={...r};o[n]=o[c];if(n!==c)delete o[c];return o;})}; },'Rename column',c+' → '+n); }
function opCase(){ const c=$('#caseCol').value, how=$('#caseHow').value;
  mutate(ds=>({rows:ds.rows.map(r=>{const o={...r}; if(typeof o[c]==='string'){
    o[c]=how==='upper'?o[c].toUpperCase():how==='lower'?o[c].toLowerCase():o[c].toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase()); } return o;})}),'Standardize case',c+' → '+how); }
function opConvert(){ const c=$('#convCol').value, to=$('#convTo').value;
  mutate(ds=>({rows:ds.rows.map(r=>{const o={...r}; const v=o[c];
    if(v===''||v==null)return o;
    if(to==='number'){const n=parseNum(v); o[c]=isNaN(n)?v:n;}
    else if(to==='date'){const t=Date.parse(v); o[c]=isNaN(t)?v:new Date(t).toISOString().slice(0,10);}
    else o[c]=String(v);
    return o;})}),'Convert type',c+' → '+to); }
function opOutliers(){ const c=$('#outCol').value; const ds=active();
  const vals=ds.rows.map(r=>parseNum(r[c])).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
  if(vals.length<8) return toast('Need ≥8 numeric values for IQR outlier detection','err');
  const q1=quantile(vals,.25), q3=quantile(vals,.75), iqr=q3-q1, lo=q1-1.5*iqr, hi=q3+1.5*iqr;
  mutate(()=>({rows:ds.rows.filter(r=>{const n=parseNum(r[c]); return isNaN(n)||(n>=lo&&n<=hi);})}),'Remove outliers (IQR)',c+' outside ['+fmt(lo)+', '+fmt(hi)+']'); }
function resetWorkspace(){
  if(!S.dataset) return;
  S.derived=null; S.cleanLog=[]; S.kpis=[]; S.charts=[]; S.sqlRes=null;
  Session.save(); updateTopbar(); render(); toast('Workspace reset');
}

V.transform_after=function(){

function opGroupby(){
  const g=$('#gbCol').value, v=$('#gbVal').value, fn=$('#gbFn').value; const ds=active();
  const groups=new Map();
  ds.rows.forEach(r=>{ const k=String(r[g]??'(blank)'); if(!groups.has(k))groups.set(k,[]); groups.get(k).push(r); });
  const headers=[g, fn+'_'+(fn==='count'?g:v)];
  const rows=[...groups.entries()].map(([k,rs])=>{
    let out;
    if(fn==='count')out=rs.length;
    else if(fn==='distinct')out=new Set(rs.map(r=>String(r[v]))).size;
    else{ const ns=rs.map(r=>parseNum(r[v])).filter(x=>!isNaN(x));
      if(!ns.length)out=''; else out=fn==='sum'?ns.reduce((a,b)=>a+b,0):fn==='avg'?mean(ns):fn==='min'?Math.min(...ns):Math.max(...ns);
      if(fn==='avg'&&typeof out==='number')out=+out.toFixed(4); }
    return {[headers[0]]:k,[headers[1]]:out};
  }).sort((a,b)=>parseNum(b[headers[1]])-parseNum(a[headers[1]]));
  S.derived={name:'Grouped: '+fn+' of '+v+' by '+g,headers,rows};
  logOp('Group-by', fn+'('+v+') by '+g);
  Session.save(); updateTopbar(); render(); toast('Derived table created ('+rows.length+' groups)');
}
function testComputed(){
  const ds=active(); const expr=$('#ccExpr').value.trim();
  if(!expr)return toast('Enter an expression first','err');
  try{
    const sample=ds.rows.slice(0,3).map(r=>evalExpression(expr,ds.headers,r));
    $('#ccHint').innerHTML='Preview: '+sample.map(x=>'<span class="mono">'+(isNaN(x)?'—':fmt(x))+'</span>').join(' , ');
  }catch(e){ $('#ccHint').innerHTML='<span style="color:var(--red);font-size:11px">'+esc(e.message)+'</span>'; }
}
function opComputed(){
  const ds=active(); const expr=$('#ccExpr').value.trim(); let name=$('#ccName').value.trim()||'computed';
  if(!expr)return toast('Enter an expression first','err');
  if(ds.headers.includes(name)){ let i=2; while(ds.headers.includes(name+'_'+i))i++; name=name+'_'+i; }
  try{
    const usedHeaders=[...ds.headers,name];
    const rows=ds.rows.map(r=>{ let val=evalExpression(expr,ds.headers,r);
      if(typeof val==='number'&&!isFinite(val))val='';
      const o={...r}; o[name]=val; return o; });
    const target=S.derived||S.dataset;
    target.headers=usedHeaders; target.rows=rows;
    logOp('Computed column', name+' = '+expr);
    Session.save(); updateTopbar(); render(); toast('Column "'+name+'" added');
  }catch(e){ toast('Expression error: '+e.message,'err'); }
}
function opSort(){
  const c=$('#sortCol').value, dir=$('#sortDir').value; const ds=active();
  const t=datasetTypes(ds)[c];
  const rows=[...ds.rows].sort((a,b)=>{
    let va=a[c],vb=b[c];
    if(t==='number'){va=parseNum(va);vb=parseNum(vb);} else {va=String(va??'').toLowerCase();vb=String(vb??'').toLowerCase();}
    if(va===''||va==null)return 1; if(vb===''||vb==null)return -1;
    return dir==='asc'?(va>vb?1:va<vb?-1:0):(va>vb?-1:va<vb?1:0); });
  mutate(()=>({rows}),'Sort',c+' '+dir);
}
function opFilter(){
  const c=$('#fltCol').value, op=$('#fltOp').value, raw=$('#fltVal').value; const ds=active();
  const t=datasetTypes(ds)[c]; const num=parseNum(raw);
  const get=r=>t==='number'?parseNum(r[c]):String(r[c]??'').toLowerCase();
  const test=r=>{ const v=get(r);
    if(op==='has')return String(r[c]??'').toLowerCase().includes(raw.toLowerCase());
    if(op==='eq')return t==='number'?v===num:String(r[c]??'').toLowerCase()===raw.toLowerCase();
    if(op==='neq')return !(t==='number'?v===num:String(r[c]??'').toLowerCase()===raw.toLowerCase());
    if(isNaN(v))return false;
    const rv=t==='number'?num:parseNum(raw);
    if(isNaN(rv))return false;
    return op==='gt'?v>rv:op==='lt'?v<rv:op==='ge'?v>=rv:v<=rv; };
  const before=ds.rows.length;
  mutate(()=>({rows:ds.rows.filter(test)}),'Filter rows',res=>c+' '+op+' "'+raw+'" · kept '+res.rows.length+'/'+before);
}

function renderEdaCol(){

function renderScatter(){
  const el=$('#scX'); if(!el)return;
  const ds=active(); const x=$('#scX').value, y=$('#scY').value;
  const pts=[]; const xs=[],ys=[];
  ds.rows.forEach(r=>{ const a=parseNum(r[x]),b=parseNum(r[y]); if(!isNaN(a)&&!isNaN(b)){pts.push({x:a,y:b});xs.push(a);ys.push(b);} });
  Charts.scatter($('#scChart'),pts,x,y);
  const r=pearson(xs,ys);
  const strength=isNaN(r)?'insufficient data':Math.abs(r)>=0.7?'strong':Math.abs(r)>=0.4?'moderate':Math.abs(r)>=0.2?'weak':'very weak';
  const dirn=r>0?'positive':r<0?'negative':'no';
  $('#scInfo').innerHTML=isNaN(r)?'<span class="fine">Not enough paired numeric values.</span>'
    :'<span class="pill">Pearson r = <b>'+r.toFixed(3)+'</b></span> <span class="sub">A <b>'+strength+'</b> '+dirn+' linear relationship (n='+fmt(pts.length)+').</span>';
}
function renderCorr(){
  const wrap=$('#corrWrap'); if(!wrap)return;
  const ds=active(); const nums=numericCols(ds).slice(0,8);
  if(nums.length<2){wrap.innerHTML='<p class="fine">At least two numeric columns are required.</p>';return;}
  const cols=nums.map(h=>ds.rows.map(r=>parseNum(r[h])));
  let best={r:0,a:'',b:''};
  let html='<div class="hm" style="grid-template-columns:repeat('+(nums.length+1)+',auto);overflow:auto"><div></div>'+nums.map(h=>'<div style="font-weight:700;color:var(--sub);align-self:end;padding-bottom:4px">'+esc(h.slice(0,8))+'</div>').join('');
  nums.forEach((a,i)=>{
    html+='<div style="font-weight:700;color:var(--sub);text-align:right;padding-right:6px;align-self:center">'+esc(a.slice(0,8))+'</div>';
    nums.forEach((b,j)=>{
      const r=i===j?1:pearson(cols[i],cols[j]);
      if(i!==j&&Math.abs(r)>Math.abs(best.r)&&i<j)best={r,a,b};
      const v=isNaN(r)?0:r;
      const op=Math.abs(v);
      html+='<div class="cell" title="'+esc(a)+' vs '+esc(b)+' · r='+(isNaN(r)?'—':r.toFixed(2))+'" style="background:rgba(2,132,199,'+(0.10+op*0.85).toFixed(2)+');color:'+(op>0.55?'#fff':'#0A192F')+'">'+(isNaN(r)?'—':v.toFixed(2))+'</div>';
    });
  });
  html+='</div>';
  wrap.innerHTML=html+(best.a?'<p class="fine" style="margin-top:8px">Strongest pair: <b>'+esc(best.a)+'</b> ↔ <b>'+esc(best.b)+'</b> (r='+best.r.toFixed(2)+').</p>':'');
}

  return `

function kpiValue(k,ds){
  const col=k.col;
  if(k.agg==='count')return ds.rows.length;
  const vals=ds.rows.map(r=>r[col]).filter(v=>v!==''&&v!=null);
  if(k.agg==='distinct')return new Set(vals.map(String)).size;
  const ns=vals.map(parseNum).filter(x=>!isNaN(x));
  if(!ns.length)return '—';
  switch(k.agg){
    case 'sum':return ns.reduce((a,b)=>a+b,0);
    case 'avg':return mean(ns);
    case 'min':return Math.min(...ns);
    case 'max':return Math.max(...ns);
  }
}
function renderKPIGrid(){
  const ds=active(); const g=$('#kpiGrid'); if(!g)return;
  if(!S.kpis.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">No KPIs yet — create one above or click Auto-generate.</div>'; return; }
  g.innerHTML=S.kpis.map(k=>{
    let inner;
    if(k.group){
      const m=new Map();
      ds.rows.forEach(r=>{ const key=String(r[k.group]??'(blank)'); if(!m.has(key))m.set(key,[]); m.get(key).push(r); });
      const rows=[...m.entries()].map(([grp,rs])=>{
        const sub={...ds,rows:rs};
        return '<tr><td>'+esc(grp.length>18?grp.slice(0,17)+'…':grp)+'</td><td>'+fmt(kpiValue(k,sub))+'</td></tr>';
      }).join('');
      inner='<div class="kv" style="font-size:17px">'+k.group+' breakdown</div><table class="kpi-mini">'+rows+'</table>';
    }else{
      inner='<div class="kv">'+fmt(kpiValue(k,ds))+'</div><div class="fine">'+k.agg+' of '+esc(k.col)+'</div>';
    }
    return '<div class="card kpi-card"><button class="x" onclick="delKPI(\''+k.id+'\')">×</button><div class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700">'+esc(k.label)+'</div>'+inner+'</div>';
  }).join('');
}

};
function vizAgg(fn,vals){
  if(fn==='count')return vals.length;
  const ns=vals.map(parseNum).filter(x=>!isNaN(x));
  if(!ns.length)return 0;
  return fn==='sum'?ns.reduce((a,b)=>a+b,0):fn==='avg'?mean(ns):fn==='min'?Math.min(...ns):Math.max(...ns);
}
function buildVizData(){
  const ds=active(); const type=$('#cType').value, x=$('#cX').value, y=$('#cY')?$('#cY').value:null, agg=$('#cAgg').value;
  if(type==='hist'){
    const vals=ds.rows.map(r=>parseNum(r[x])).filter(v=>!isNaN(v));
    return {type,labels:vals.map(v=>v),series:[{name:x,values:vals}],x,title:$('#cTitle').value.trim()||('Distribution of '+x),hist:true};
  }
  if(type==='scatter'){
    const pts=[]; ds.rows.forEach(r=>{const a=parseNum(r[x]),b=parseNum(r[y]); if(!isNaN(a)&&!isNaN(b))pts.push({x:a,y:b});});
    return {type,x,y,pts,title:$('#cTitle').value.trim()||(y+' vs '+x)};
  }
  const m=new Map();
  ds.rows.forEach(r=>{ const k=String(r[x]??'(blank)'); if(!m.has(k))m.set(k,[]); m.get(k).push(r[y]); });
  const entries=[...m.entries()].sort((a,b)=>vizAgg(agg,b[1])-vizAgg(agg,a[1]));
  const top=entries.length>20?entries.slice(0,20):entries;
  return {type,labels:top.map(e=>e[0]),series:[{name:agg+' of '+y,values:top.map(e=>vizAgg(agg,e[1]))}],x,y,agg,title:$('#cTitle').value.trim()||((agg==='count'?'Count':agg+' of '+y)+' by '+x)};
}
function drawViz(canvas,cfg,opts={}){
  const o={title:cfg.title,...opts};
  if(cfg.hist){ Charts.hist(canvas,cfg.series[0].values,o); return; }
  if(cfg.type==='scatter'){ Charts.scatter(canvas,cfg.pts,cfg.x,cfg.y,o); return; }
  if(cfg.type==='pie'){ Charts.pie(canvas,cfg.labels,cfg.series[0].values,o); return; }
  if(cfg.type==='line'){ Charts.line(canvas,cfg.labels,cfg.series,o); return; }
  Charts.bar(canvas,cfg.labels,cfg.series[0].values,o);
}
function renderVizPreview(){
  const cfg=buildVizData();
  if((cfg.type!=='scatter'&&cfg.type!=='hist')&&!cfg.series[0].values.length)return toast('No data for that combination','err');
  if(cfg.type==='scatter'&&!cfg.pts.length)return toast('No paired numeric values','err');
  $('#vizPreview').innerHTML='<canvas id="vizCanvas" class="chart" data-h="300"></canvas>';

function vizHint(){

function generateInsights(){
  const ds=active(); const q=qualityReport(ds); const types=datasetTypes(ds);
  const out=[]; const nums=numericCols(ds), cats=catCols(ds);
  if(q.score<70)out.push({t:'Data quality needs attention',d:'Overall score '+q.score+'/100 with '+q.missing+' missing cells and '+q.dupRows+' duplicate rows.',s:'warn'});
  else out.push({t:'Data quality is solid',d:'Overall score '+q.score+'/100 — completeness '+q.completeness+'%, uniqueness '+q.uniqueness+'%, validity '+q.validity+'%.',s:'good'});
  const strCats=cats.filter(c=>types[c]==='string'||types[c]==='boolean');
  if(strCats.length){
    const c=strCats[0]; const t=topVals(ds.rows.map(r=>r[c]).filter(v=>v!==''),1)[0];
    if(t)out.push({t:'"'+String(t.v).slice(0,30)+'" dominates '+c,d:String(t.c)+' of '+fmt(ds.rows.length)+' rows ('+pct(t.c/ds.rows.length)+') belong to this category.',s:''});
  }
  const dateCol=ds.headers.find(h=>types[h]==='date');
  const valCol=nums[0];
  if(dateCol&&valCol){
    const m=new Map();
    ds.rows.forEach(r=>{ const t=Date.parse(r[dateCol]); const v=parseNum(r[valCol]); if(!isNaN(t)&&!isNaN(v)){ const k=String(r[dateCol]).slice(0,7); m.set(k,(m.get(k)||0)+v); } });
    const ks=[...m.keys()].sort();
    if(ks.length>=4){
      const xs=ks.map((_,i)=>i), ys=ks.map(k=>m.get(k));
      const slope=linSlope(xs,ys);
      const first=m.get(ks[0]), last=m.get(ks[ks.length-1]);
      out.push({t:(slope>=0?'Upward':'Downward')+' trend in '+valCol,d:'Monthly '+valCol+' '+(slope>=0?'increased':'decreased')+' from '+fmt(first)+' ('+ks[0]+') to '+fmt(last)+' ('+ks[ks.length-1]+').',s:slope>=0?'good':'warn'});
    }
  }
  if(nums.length>=2){
    let best={r:0,a:'',b:''};
    for(let i=0;i<nums.length;i++)for(let j=i+1;j<nums.length;j++){
      const xs=[],ys=[];
      ds.rows.forEach(r=>{const a=parseNum(r[nums[i]]),b=parseNum(r[nums[j]]); if(!isNaN(a)&&!isNaN(b)){xs.push(a);ys.push(b);}});
      const r=pearson(xs,ys); if(!isNaN(r)&&Math.abs(r)>Math.abs(best.r))best={r,a:nums[i],b:nums[j]};
    }
    if(Math.abs(best.r)>=0.5)out.push({t:'Strong correlation: '+best.a+' ↔ '+best.b,d:'Pearson r = '+best.r.toFixed(2)+'. These two metrics move together strongly.',s:''});
  }
  if(nums.length){
    let worst=null;
    nums.forEach(h=>{ const v=ds.rows.map(r=>parseNum(r[h])).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
      if(v.length<8)return; const q1=quantile(v,.25),q3=quantile(v,.75),iqr=q3-q1;
      const cnt=v.filter(x=>x<q1-1.5*iqr||x>q3+1.5*iqr).length;
      if(!worst||cnt>worst.c)worst={h,c:cnt}; });
    if(worst&&worst.c>0)out.push({t:worst.c+' outlier(s) in '+worst.h,d:'Values outside the IQR fence in "'+worst.h+'".',s:'warn'});
  }
  return out.slice(0,8);
}
V.insights=function(){
  if(!needDS())return '';
  const ins=generateInsights();
  const counts={warn:ins.filter(i=>i.s==='warn').length,good:ins.filter(i=>i.s==='good').length};
  return `
  <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap">

  </div>
  <div class="grid g2">${ins.map(i=>`<div class="card insight ${i.s}"><b>${esc(i.t)}</b><p>${esc(i.d)}</p></div>`).join('')}</div>`;
